name: Build and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Check output formatting and settings
        run: dotnet run --project tests/OutputSettings.Tests -c Release
      - name: Publish executable and checksum
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            ./scripts/Publish.ps1 -Tag $env:REF_NAME
          } else {
            ./scripts/Publish.ps1
          }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: TidalNowPlaying-win-x64
          path: |
            artifacts/TidalNowPlaying.exe
            artifacts/TidalNowPlaying.exe.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: TidalNowPlaying-win-x64
          path: artifacts
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              artifacts/TidalNowPlaying.exe \
              artifacts/TidalNowPlaying.exe.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" \
              artifacts/TidalNowPlaying.exe \
              artifacts/TidalNowPlaying.exe.sha256 \
              --verify-tag --title "$RELEASE_TAG" --generate-notes \
              --notes "Requires the .NET 8 Desktop Runtime for Windows x64. The SHA-256 checksum verifies file integrity; this release does not include a GPG signature."
          fi
